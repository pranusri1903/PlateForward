# Runs the whole app: docker compose up --build
#   App         http://localhost:5173   (log in as foodbank@demo.com / demo1234)
#   Mail inbox  http://localhost:8025   (every email the app sends lands here)
#   API health  http://localhost:8080/actuator/health
# Reset all data: docker compose down -v
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: plateforward
      POSTGRES_USER: plateforward
      POSTGRES_PASSWORD: plateforward
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plateforward -d plateforward"]
      interval: 3s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: demo # sample accounts and listings
      DATABASE_URL: jdbc:postgresql://db:5432/plateforward
      DB_USER: plateforward
      DB_PASSWORD: plateforward
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: 1025
      FRONTEND_URL: http://localhost:5173
      CORS_ORIGINS: http://localhost:5173
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
      # JWT_SECRET, ADMIN_EMAIL and ADMIN_PASSWORD keep their development defaults here. Set real values for any deployment.
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/actuator/health | grep -q UP"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  pgdata:
