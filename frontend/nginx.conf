server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # The browser talks only to this server, so there is no cross-origin setup to worry about
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Built files have hashed names, so they can be cached for a year
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: any other path (e.g. /listings/5) serves index.html and React Router takes over
    location / {
        try_files $uri /index.html;
    }
}
