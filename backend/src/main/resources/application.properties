spring.application.name=plateforward

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/plateforward}
spring.datasource.username=${DB_USER:plateforward}
spring.datasource.password=${DB_PASSWORD:plateforward}

# Flyway owns the schema; Hibernate only checks that entities match it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.mvc.problemdetails.enabled=true

app.jwt-secret=${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
app.jwt-ttl=PT12H
app.claim-hold=PT2H
app.cors-origins=${CORS_ORIGINS:http://localhost:5173}
app.admin.email=${ADMIN_EMAIL:admin@plateforward.local}
app.admin.password=${ADMIN_PASSWORD:admin12345}
